<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>BCHC Teacher Connect</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<script>
  /* Google Apps Script web app URL (the backend). */
  window.BCHC_API_URL = 'https://script.google.com/macros/s/AKfycbyS0sLhLEn-xRNgnhNxy9gvDZVrMrhfwdUfZKtL8Evn-4q-X7TF5wJT_KCIZN114p7nMQ/exec';
</script>
<style>
/* Layout: phone-first single column with a bottom tab bar for teachers; a wide tabbed workspace for the admin.
   Brand: BCHC yellow, black, green, white. */
:root{
  --bg:#f6f6f1; --surface:#ffffff; --surface-2:#efefe7; --line:#e2e2d8;
  --ink:#121212; --ink-2:#4a4a44; --ink-3:#7c7c73;
  --yellow:#ffd200; --yellow-ink:#121212; --yellow-soft:#fff3b8;
  --green:#138a43; --green-ink:#ffffff; --green-soft:#daf2e2;
  --black:#121212; --black-ink:#ffffff;
  --red:#c62828; --red-soft:#fde3e1; --amber:#9a5b00; --amber-soft:#ffecc7;
  --display:'Instrument Serif', 'Noto Sans Telugu', 'Iowan Old Style', Georgia, serif;
  --body:'Manrope', 'Noto Sans Telugu', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --shade:radial-gradient(1100px 700px at -10% -10%, rgba(255,210,0,.20), transparent 60%), radial-gradient(900px 700px at 110% 110%, rgba(19,138,67,.12), transparent 60%), linear-gradient(180deg, #fbfbf7 0%, #f1f1ea 100%);
  --radius:16px; --shadow:0 1px 2px rgba(18,18,18,.06), 0 8px 24px rgba(18,18,18,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c0c0c; --surface:#181818; --surface-2:#222220; --line:#2e2e2b;
  --ink:#f4f4ef; --ink-2:#c3c3b9; --ink-3:#8f8f86;
  --yellow-soft:#3a3209; --green:#35c06b; --green-ink:#08210f; --green-soft:#14301f;
  --black:#f4f4ef; --black-ink:#121212;
  --red:#ff7a72; --red-soft:#3a1716; --amber:#ffbf55; --amber-soft:#3a2a0c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); --shade:radial-gradient(1100px 700px at -10% -10%, rgba(255,210,0,.10), transparent 60%), radial-gradient(900px 700px at 110% 110%, rgba(53,192,107,.08), transparent 60%), linear-gradient(180deg, #111110 0%, #0a0a0a 100%); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#181818; --surface-2:#222220; --line:#2e2e2b;
  --ink:#f4f4ef; --ink-2:#c3c3b9; --ink-3:#8f8f86;
  --yellow-soft:#3a3209; --green:#35c06b; --green-ink:#08210f; --green-soft:#14301f;
  --black:#f4f4ef; --black-ink:#121212;
  --red:#ff7a72; --red-soft:#3a1716; --amber:#ffbf55; --amber-soft:#3a2a0c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); --shade:radial-gradient(1100px 700px at -10% -10%, rgba(255,210,0,.10), transparent 60%), radial-gradient(900px 700px at 110% 110%, rgba(53,192,107,.08), transparent 60%), linear-gradient(180deg, #111110 0%, #0a0a0a 100%); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
html{background-color:var(--bg)}
body{background-color:var(--bg);background-image:var(--shade);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body.has-nav{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.1rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
a{color:var(--green)}

/* header */
.topbar{background:linear-gradient(180deg,#1b1b1b 0%,#0e0e0e 100%);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.topbar-in{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:46px;height:46px;flex:none;display:block}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:0}
.brand span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:#ffd200;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.topbtn{background:transparent;border:1.5px solid rgba(255,255,255,.28);color:#fff;cursor:pointer;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.88rem;white-space:nowrap}
.topbtn:hover{border-color:#ffd200;color:#ffd200}

.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:500px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:.88rem}
.eyebrow{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.in{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:1rem}
.in:focus{border-color:var(--ink);outline:none}
textarea.in{min-height:76px;resize:vertical}
.pinin{letter-spacing:.4em;font-size:1.3rem!important;text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;cursor:pointer;text-decoration:none;
  padding:12px 18px;font-weight:700;font-size:1rem;background:var(--surface-2);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.yellow{background:var(--yellow);color:var(--yellow-ink)}
.btn.green{background:var(--green);color:var(--green-ink)}
.btn.black{background:var(--black);color:var(--black-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.small{padding:7px 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn.huge{padding:18px;font-size:1.6rem;border-radius:18px;font-family:var(--display);font-weight:400;letter-spacing:.01em}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)} .pill.info{background:var(--yellow-soft);color:var(--ink)}
.pill.none{background:var(--surface-2);color:var(--ink-3)}
.msg{padding:12px 14px;border-radius:12px;font-weight:600}
.msg.err{background:var(--red-soft);color:var(--red)} .msg.good{background:var(--green-soft);color:var(--green)} .msg.note{background:var(--yellow-soft);color:var(--ink)}
.badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;align-items:center;justify-content:center;margin-left:6px}

/* teacher home */
.hello h1{font-size:1.7rem}
.daystrip{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.daystrip div{padding:10px;text-align:center}
.daystrip div+div{border-left:1px solid var(--line)}
.daystrip small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.daystrip b{font-family:var(--display);font-weight:400;font-size:1.45rem;white-space:nowrap}
.clock{font-family:var(--display);font-size:3rem;font-weight:400;line-height:1}
.meet{background:radial-gradient(380px 260px at 105% -10%, rgba(255,210,0,.38), transparent 60%),radial-gradient(300px 200px at -10% 120%, rgba(19,138,67,.30), transparent 65%),linear-gradient(160deg,#1c1c1c 0%,#0d0d0d 100%);color:#fff;border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.meet > *{position:relative;z-index:1}
.meet .eyebrow{color:#ffd200}
.meet h3{font-size:1.75rem;max-width:70%}
.meet .when{color:#d9d9d0}
.meet .live{display:inline-flex;align-items:center;gap:6px;background:#35c06b;color:#08210f;font-weight:800;font-size:.8rem;padding:2px 10px;border-radius:999px}
.meet .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#08210f;animation:pulse 1s infinite alternate}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{font-size:1.7rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.72rem;font-weight:700;color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.day{position:relative;aspect-ratio:1/1;min-width:0;border-radius:10px;border:1px solid transparent;background:var(--surface);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-weight:600;font-size:.95rem}
.day.blank{background:transparent;cursor:default}
.day.class{background:var(--green-soft);color:var(--green)}
.day.holiday{background:var(--red-soft);color:var(--red)}
.day.off{color:var(--ink-3)}
.day.today{border-color:var(--ink);border-width:2px}
.day.sel{outline:3px solid var(--yellow);outline-offset:1px}
.day .marks{display:flex;gap:3px;height:8px;margin-top:2px}
.day .mk{width:7px;height:7px;border-radius:50%}
.mk.mt{background:#d9a900} .mk.lv{background:#2f6fde} .mk.done{background:var(--green)} .mk.miss{background:var(--red)} .mk.note{background:var(--ink-3)}
.day .cnt{font-size:.66rem;font-weight:700;color:var(--ink-2);line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.daydetail{border-top:1px solid var(--line);padding-top:12px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:40;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav .lbl{position:relative}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--ink-3);cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:var(--yellow);color:#121212}
.nav .ic{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px}

/* camera */
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;max-width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.cam .oval{position:absolute;inset:12% 18% 22%;border:3px dashed rgba(255,210,0,.85);border-radius:50%;pointer-events:none}
.gps{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:var(--ink-3)}
.dot.ok{background:var(--green)} .dot.warn{background:var(--yellow)} .dot.bad{background:var(--red)}
.dot.wait{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
.result{text-align:center}
.result .big{font-family:var(--display);font-size:3.6rem;font-weight:400;line-height:1}

/* admin */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{display:block;color:var(--ink-3);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em}
.kpi b{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1.05}
.kpi b em{font-style:normal;font-size:1rem;color:var(--ink-3)}
.kpi.hl{background:var(--yellow);border-color:var(--yellow);color:#121212}
.kpi.hl small{color:#3d3a20}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar label.f{min-width:140px;flex:1 1 140px;max-width:220px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-ok{white-space:normal;min-width:160px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:inline-block;vertical-align:middle;border:1px solid var(--line)}
.thumbbtn{border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.thumbph{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:var(--surface-2);color:var(--ink-3);font-size:.7rem;font-weight:700;border:1px dashed var(--line)}
.who{display:flex;flex-direction:column;line-height:1.2}
.who small{color:var(--ink-3)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.reqcard{display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--yellow)}
.reqcard.APPROVED{border-left-color:var(--green)} .reqcard.REJECTED,.reqcard.CANCELLED{border-left-color:var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){ .split{grid-template-columns:1fr} }
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;cursor:pointer}
.chk input{accent-color:var(--green)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:min(560px,100%);max-height:100%;overflow:auto}
.photoBig{width:100%;border-radius:12px;background:var(--surface-2);min-height:200px;object-fit:contain}
.spinner{width:22px;height:22px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
/* warli + profile */
#topBand{height:3px;background:linear-gradient(90deg,#ffd200 0%,#ffd200 55%,#138a43 100%)}
.topbar{position:relative}
.hero{position:relative;overflow:hidden;color:#121212;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px rgba(196,150,0,.28);
  background:radial-gradient(420px 220px at 100% 0%, rgba(255,255,255,.55), transparent 60%),radial-gradient(360px 240px at 0% 110%, rgba(19,138,67,.22), transparent 65%),linear-gradient(135deg,#ffe45c 0%,#ffd200 50%,#f0b400 100%)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(18,18,18,.10),transparent 70%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:#5b4b00}
.hero h1{font-size:2.3rem}
.hero .who-row{display:flex;gap:14px;align-items:center}
.hero .chip{display:inline-flex;align-items:center;gap:6px;background:#121212;color:#ffd200;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.02em}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:#121212;color:#ffd200;font-weight:800;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.av.sm{border-width:2px;box-shadow:none}
button.avbtn{border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.profile-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.profile-head h1{font-size:2.4rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1}
.stat small{color:var(--ink-3);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em}
.infolist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;margin:0}
.infolist dt{color:var(--ink-3);font-weight:600}
.infolist dd{margin:0;font-weight:600}
.namecell{display:flex;align-items:center;gap:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
/* workspace */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.note{white-space:pre-wrap;word-break:break-word;font-size:1rem;line-height:1.6}
.ann{display:flex;flex-direction:column;gap:6px;border-left:5px solid transparent}
.ann.unread{border-left-color:var(--yellow)}
.ann .meta{font-size:.78rem;color:var(--ink-3);font-weight:600}
.ann h3{font-size:1.45rem}
.task{display:flex;gap:12px;align-items:flex-start}
.task input[type=checkbox]{width:24px;height:24px;margin-top:3px;accent-color:var(--green);flex:none}
.task.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.balcard{border-radius:16px;padding:16px;background:var(--surface-2)}
.balcard b{display:block;font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1}
.balcard small{font-weight:700;color:var(--ink-2)}
.balcard.sick{background:linear-gradient(135deg,var(--green-soft),transparent)}
.balcard.casual{background:linear-gradient(135deg,var(--yellow-soft),transparent)}
.menu{display:flex;flex-direction:column}

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script>
(function(){
'use strict';

/* ============================================================ basics */
var API = (new URLSearchParams(location.search).get('api')) || window.BCHC_API_URL || '';
var app = document.getElementById('app');
var topAction = document.getElementById('topAction');
var nav = document.getElementById('nav');
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var store = {
  get: function(k){ try { return JSON.parse(localStorage.getItem('bchc_'+k)); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem('bchc_'+k, JSON.stringify(v)); } catch(e){} },
  del: function(k){ try { localStorage.removeItem('bchc_'+k); } catch(e){} }
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(sel, root){ return (root||document).querySelector(sel); }
function toast(text){
  document.querySelectorAll('.toast').forEach(function(o){ o.remove(); });
  var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=text; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2800);
}
function api(action, data){
  if (!API) return Promise.reject(new Error('The app is not connected to the Google Sheet yet.'));
  var body = Object.assign({action:action}, data||{});
  return fetch(API, {method:'POST', body: JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .catch(function(){ throw new Error('No internet or the server did not answer. Try again.'); })
    .then(function(res){ if (!res || !res.ok) throw new Error((res && res.error) || 'Something went wrong.'); return res; });
}
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s,n){ var d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function fmt12(t){ if(!t) return '—'; var p=String(t).split(':'); var h=+p[0], m=p[1]; var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }
function fmtShort(t){ if(!t) return ''; var p=String(t).split(':'); var h=+p[0], m=p[1]; var ap=h>=12?'pm':'am'; h=h%12||12; return h+(m==='00'?'':':'+m)+ap; }
function niceDate(s){ if(!s) return ''; return parseISO(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function niceDay(s){ return parseISO(s).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}); }
function mins(t){ if(!t) return null; var p=String(t).split(':'); return (+p[0])*60+(+p[1])+((+p[2]||0)/60); }
function nowMins(){ var d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60+0.01; }
function durText(m){ if(m==null||m<0) return '—'; var h=Math.floor(m/60), mm=Math.round(m%60); if(mm===60){h++;mm=0;} return h+'h '+pad(mm)+'m'; }
function haversine(a,b,c,d){ var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r; var s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2); return Math.round(2*R*Math.asin(Math.sqrt(s))); }
function fmtDist(m){ if(m==null||m==='') return '—'; m=+m; return m>=1000 ? (m/1000).toFixed(1)+' km' : m+' m'; }
function geoPill(g, dist){
  if (g==='INSIDE') return '<span class="pill ok">At school'+(dist!==''&&dist!=null?' · '+dist+' m':'')+'</span>';
  if (g==='OUTSIDE') return '<span class="pill bad">Outside · '+fmtDist(dist)+'</span>';
  if (g==='REGULARIZED') return '<span class="pill info">Fixed by request</span>';
  return '<span class="pill none">School location not set</span>';
}
function statusPill(s){
  return {PENDING:'<span class="pill warn">Waiting</span>',APPROVED:'<span class="pill ok">Approved</span>',REJECTED:'<span class="pill bad">Rejected</span>',CANCELLED:'<span class="pill none">Cancelled</span>'}[s]||esc(s);
}
function groupDays(records){
  var map={};
  records.forEach(function(r){
    var k=r.teacherId+'|'+r.date; var d=map[k]||(map[k]={teacherId:r.teacherId,name:r.name,date:r.date,inR:null,outR:null});
    if(r.type==='IN') d.inR=r; else if(r.type==='OUT') d.outR=r;
  });
  return Object.keys(map).map(function(k){ var d=map[k]; d.hours = d.inR&&d.outR ? mins(d.outR.time)-mins(d.inR.time) : null; return d; })
    .sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
}

function leaveBalance(leaves, s, ym){
  var out={};
  ['SICK','CASUAL'].forEach(function(tp){
    var limit=+(tp==='SICK'?s.SICK_PER_MONTH:s.CASUAL_PER_MONTH)||0;
    var used=(leaves||[]).filter(function(l){ return l.type===tp && String(l.date).slice(0,7)===ym && (l.status==='APPROVED'||l.status==='PENDING'); }).length;
    out[tp]={limit:limit, used:used, left:Math.max(0,limit-used)};
  });
  return out;
}
function linkify(text){ return esc(text).replace(/https:\/\/[^\s<]+/g, function(u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; }); }
function initials(name){ return String(name||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0);}).join('').toUpperCase()||'?'; }
function avatarHtml(t, size, extraCls){
  var st='width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.38)+'px';
  if(t&&t.avatar) return '<img class="av '+(extraCls||'')+'" src="'+esc(t.avatar)+'" alt="'+esc(t.name||'')+'" style="'+st+'">';
  return '<span class="av '+(extraCls||'')+'" style="'+st+'" aria-hidden="true">'+esc(initials(t&&t.name))+'</span>';
}
/* Square-crops a chosen photo to 220x220 JPEG so it fits in one Sheet cell. */
function makeAvatar(file){
  return new Promise(function(res, rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var sz=Math.min(img.naturalWidth,img.naturalHeight), c=document.createElement('canvas'); c.width=c.height=220;
      c.getContext('2d').drawImage(img,(img.naturalWidth-sz)/2,(img.naturalHeight-sz)/2,sz,sz,0,0,220,220);
      URL.revokeObjectURL(url);
      var q=.8, out=c.toDataURL('image/jpeg',q);
      while(out.length>44000 && q>.3){ q-=.1; out=c.toDataURL('image/jpeg',q); }
      res(out);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('That photo could not be opened. Try another one.')); };
    img.src=url;
  });
}

/* ------------------------------------------- calendar rules (shared) */
function calMapOf(list){ var m={}; (list||[]).forEach(function(c){ m[c.date]=c; }); return m; }
function dayInfo(dateStr, s, calMap){
  var wd=parseISO(dateStr).getDay(), o=calMap[dateStr]||{};
  var normal=normalType(wd, s), type=o.dayType || normal;
  var meeting = o.meeting ? o.meeting==='YES' : (wd===+(s.MEETING_DAY||6) && type!=='HOLIDAY');
  var note=o.note || (!o.dayType && normal==='HOLIDAY' ? 'Weekly holiday' : '');
  return {date:dateStr, wd:wd, type:type, normal:normal, isClass:type==='CLASS', holiday:type==='HOLIDAY', meeting:meeting, note:note, custom:!!(o.dayType||o.meeting||o.note), raw:o};
}
function dayList(v){ return String(v==null?'':v).split(',').filter(function(x){return x!=='';}).map(Number); }
function normalType(wd, s){
  if(dayList(s.WEEKLY_HOLIDAYS==null?'0':s.WEEKLY_HOLIDAYS).indexOf(wd)>=0) return 'HOLIDAY';
  return dayList(s.CLASS_DAYS==null?'6':s.CLASS_DAYS).indexOf(wd)>=0 ? 'CLASS' : 'OFF';
}
var TYPE_WORD={CLASS:'class day',OFF:'no class',HOLIDAY:'holiday'};
function weekText(s){
  var c=dayList(s.CLASS_DAYS).filter(function(d){return dayList(s.WEEKLY_HOLIDAYS).indexOf(d)<0;}).map(function(d){return DOW_LONG[d];});
  var h=dayList(s.WEEKLY_HOLIDAYS).map(function(d){return DOW_LONG[d];});
  return 'Class every '+(c.length?c.join(', '):'—')+(h.length?' · Holiday every '+h.join(', '):'');
}
function dayLabel(info){
  if(info.holiday) return info.note==='Weekly holiday' ? DOW_LONG[info.wd]+' holiday' : 'Holiday'+(info.note?': '+info.note:'');
  return (info.isClass?'Class day':'No class')+(info.note?' · '+info.note:'');
}
function nextMeeting(s, calMap){
  var t=todayISO(), now=nowMins();
  for(var i=0;i<70;i++){
    var d=addDays(t,i), info=dayInfo(d,s,calMap);
    if(!info.meeting) continue;
    if(i===0 && now>mins(s.MEETING_END||'18:00')) continue;
    var live = i===0 && now>=mins(s.MEETING_START||'17:00')-10 && now<=mins(s.MEETING_END||'18:00');
    return {date:d, inDays:i, live:live};
  }
  return null;
}
function meetingCard(s, calMap){
  var m=nextMeeting(s, calMap), link=s.MEETING_LINK||'';
  var time=fmtShort(s.MEETING_START||'17:00')+' – '+fmtShort(s.MEETING_END||'18:00');
  var when = !m ? 'No meeting planned in the next weeks' :
    (m.live ? 'Happening now · '+time : (m.inDays===0?'Today':m.inDays===1?'Tomorrow':niceDay(m.date))+' · '+time);
  var btn = link ? '<a class="btn '+(m&&m.live?'green':'yellow')+' block" href="'+esc(link)+'" target="_blank" rel="noopener">'+(m&&m.live?'Join meeting now':'Open meeting link')+'</a>'
                 : '<div class="msg note" style="background:#2a2a28;color:#ffd200">The admin will add the meeting link soon.</div>';
  return '<section class="meet" aria-label="Weekly meeting"><div class="eyebrow">Every '+esc(DOW_LONG[+(s.MEETING_DAY||6)])+'</div>'+
    '<h3>'+esc(s.MEETING_TITLE||'Weekly team meeting')+'</h3>'+
    '<div class="row">'+(m&&m.live?'<span class="live">LIVE</span>':'')+'<span class="when num">'+esc(when)+'</span></div>'+btn+'</section>';
}

/* Month grid. opts: {month:'YYYY-MM', s, calMap, selected, marks:function(info)->{html,cnt}, onPick} */
function renderMonth(el, opts){
  var y=+opts.month.slice(0,4), m=+opts.month.slice(5,7)-1;
  var first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), t=todayISO();
  var h='<div class="cal" role="grid">'+DOW.map(function(d){return '<div class="dow">'+d.slice(0,2)+'</div>';}).join('');
  for(var i=0;i<first.getDay();i++) h+='<div class="day blank" aria-hidden="true"></div>';
  for(var d=1; d<=days; d++){
    var ds=y+'-'+pad(m+1)+'-'+pad(d), info=dayInfo(ds, opts.s, opts.calMap);
    var cls='day '+(info.holiday?'holiday':info.isClass?'class':'off')+(ds===t?' today':'')+(ds===opts.selected?' sel':'');
    var mk=opts.marks?opts.marks(info):{html:'',cnt:''};
    var dots=(info.meeting?'<span class="mk mt"></span>':'')+(mk.html||'')+(info.note&&!info.holiday?'<span class="mk note"></span>':'');
    h+='<button class="'+cls+'" data-date="'+ds+'" aria-label="'+esc(niceDay(ds)+', '+dayLabel(info)+(info.meeting?', meeting':''))+'"><span class="num">'+d+'</span>'+
      (mk.cnt?'<span class="cnt num">'+mk.cnt+'</span>':'')+'<span class="marks">'+dots+'</span></button>';
  }
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-date]').forEach(function(b){ b.onclick=function(){ opts.onPick(b.getAttribute('data-date')); }; });
}
function legendHtml(extra){
  return '<div class="legend"><span><i style="background:var(--green-soft);border:1px solid var(--green)"></i>Class day</span>'+
    '<span><i style="background:var(--red-soft);border:1px solid var(--red)"></i>Holiday</span>'+
    '<span><i style="background:#d9a900;border-radius:50%"></i>Meeting</span>'+(extra||'')+'</div>';
}
function shiftMonth(ym, n){ var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+n; var d=new Date(y,m,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthTitle(ym){ return MONTHS[+ym.slice(5,7)-1]+' '+ym.slice(0,4); }

/* ============================================================ router */
function route(){
  stopCamera();
  if (location.hash === '#admin') return Admin.start();
  return Teacher.start();
}
window.addEventListener('hashchange', route);

/* ============================================================ TEACHER */
var Teacher = (function(){
  var session=null, info=null, hist=null, clockTimer=null, view='home', calMonth=todayISO().slice(0,7), calSel=todayISO(), prefill=null;

  function start(){
    topAction.hidden=false;
    session=store.get('teacher');
    if(!session) return loginView();
    topAction.textContent='Sign out';
    topAction.onclick=function(){ store.del('teacher'); session=null; info=null; hist=null; loginView(); };
    nav.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ go(b.getAttribute('data-view')); }; });
    loadHome();
  }
  function showNav(on){ nav.hidden=!on; document.body.classList.toggle('has-nav',on); }
  function go(v){
    view=v; stopCamera();
    nav.querySelectorAll('button').forEach(function(b){ if(b.getAttribute('data-view')===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    window.scrollTo(0,0);
    var navv={requests:'profile',resources:'profile'}[v]||v;
    nav.querySelectorAll('button').forEach(function(b){ if(b.getAttribute('data-view')===navv) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    ({home:homeView,calendar:calendarView,profile:profileView,updates:updatesView,leave:leaveView,resources:resourcesView,requests:requestsView}[v]||homeView)();
  }
  function unreadCount(){ return info ? info.announcements.filter(function(a){return !a.read;}).length : 0; }
  function openTasks(){ return info ? info.tasks.filter(function(k){return !k.done;}).length : 0; }
  function setBadge(){ var n=unreadCount()+openTasks(); document.getElementById('navBadge').innerHTML=n?'<span class="badge">'+n+'</span>':''; }

  function loginView(msg){
    showNav(false);
    topAction.textContent='Admin';
    topAction.onclick=function(){ location.hash='#admin'; };
    app.innerHTML=
      '<div class="narrow stack">'+
        '<section class="hero"><div class="eyebrow">Bhim Children Happiness Center</div><h1>Welcome, teacher</h1><p style="margin:6px 0 0">Sign in once on your phone. After that, checking in takes one selfie.</p>'+'</section>'+
        '<form class="card stack" id="loginForm" novalidate>'+
          '<label class="f">Teacher ID<input class="in" id="tId" autocomplete="username" autocapitalize="characters" placeholder="e.g. T01" required></label>'+
          '<label class="f">PIN<input class="in pinin num" id="tPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="••••" required></label>'+
          '<div id="loginMsg" aria-live="polite">'+(msg?'<div class="msg err">'+esc(msg)+'</div>':'')+'</div>'+
          '<button class="btn yellow block" id="loginBtn" type="submit">Sign in</button>'+
          '<p class="faint" style="margin:0">Your ID and PIN come from the BCHC admin.</p>'+
        '</form>'+
      '</div>';
    $('#loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var id=$('#tId').value.trim().toUpperCase(), pin=$('#tPin').value.trim();
      if(!id||!pin){ $('#loginMsg').innerHTML='<div class="msg err">Enter your Teacher ID and PIN.</div>'; return; }
      var b=$('#loginBtn'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Signing in';
      api('login',{teacherId:id,pin:pin}).then(function(){
        session={teacherId:id,pin:pin}; store.set('teacher',session); start();
      }).catch(function(err){ b.disabled=false; b.textContent='Sign in'; $('#loginMsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'; });
    });
  }

  function loadHome(){
    showNav(false);
    app.innerHTML='<div class="narrow card" style="text-align:center"><span class="spinner"></span><p class="muted">Loading your day…</p></div>';
    api('login', session).then(function(res){ info=res; document.getElementById('orgName').textContent=res.org||'Bhim Children Happiness Center'; showNav(true); setBadge(); go(view); })
      .catch(function(err){
        if (/PIN|ID|switched off/.test(err.message)) { store.del('teacher'); return loginView(err.message); }
        app.innerHTML='<div class="narrow stack"><div class="msg err">'+esc(err.message)+'</div><button class="btn yellow" id="retry">Try again</button></div>';
        $('#retry').onclick=loadHome;
      });
  }
  function loadHist(){ return api('myHistory', session).then(function(r){ hist=r; info.pendingRequests=r.requests.filter(function(q){return q.status==='PENDING';}).length; setBadge(); return r; }); }

  /* ----- Home */
  function homeView(){
    var t=info.teacher, s=info.settings, calMap=calMapOf(info.calendar);
    var dInfo=dayInfo(info.serverDate, s, calMap);
    var inR=info.today.filter(function(r){return r.type==='IN';})[0];
    var outR=info.today.filter(function(r){return r.type==='OUT';})[0];
    var worked = inR&&outR ? durText(mins(outR.time)-mins(inR.time)) : (inR ? 'In class' : '—');
    var first=(t.name||'').split(' ')[0];
    var action;
    if(!inR) action='<button class="btn yellow huge block" id="go" data-type="IN">Check in</button><p class="faint" style="text-align:center;margin:0">Class starts at '+esc(fmt12(s.SCHOOL_START))+'</p>';
    else if(!outR) action='<button class="btn green huge block" id="go" data-type="OUT">Check out</button><p class="faint" style="text-align:center;margin:0">Check out when you leave.</p>';
    else action='<div class="msg good" style="text-align:center">You are done for today. Thank you, '+esc(first)+'!</div>';
    var dayPill = dInfo.holiday ? '<span class="pill bad">'+esc(dayLabel(dInfo))+'</span>' : dInfo.isClass ? '<span class="pill ok">'+esc(dayLabel(dInfo))+'</span>' : '<span class="pill none">'+esc(dayLabel(dInfo))+'</span>';

    app.innerHTML=
      '<div class="narrow stack">'+
        '<section class="hero"><div class="who-row"><button class="avbtn" id="toProfile" aria-label="Open my profile">'+avatarHtml(t,68)+'</button>'+
          '<div style="min-width:0"><div class="eyebrow">'+esc(niceDate(info.serverDate))+'</div><h1>Namaste, '+esc(first)+'</h1>'+
          '<div class="row" style="margin-top:6px;gap:6px"><span class="chip">'+esc(t.id)+'</span>'+(t.school?'<span class="chip">'+esc(t.school)+'</span>':'')+'</div></div></div>'+'</section>'+
        '<section class="card stack" aria-label="Today">'+
          '<div class="row between"><div class="clock num" id="clock">--:--</div>'+dayPill+'</div>'+
          '<div class="daystrip num">'+

  function punchView(type){
    showNav(false);
    var t=info.teacher, label= type==='IN'?'Check in':'Check out';
    app.innerHTML=
      '<div class="narrow stack">'+
        '<div class="row between"><h2>'+label+'</h2><button class="btn small ghost" id="cancel">Cancel</button></div>'+
        '<div class="cam" id="cam"><video id="vid" playsinline autoplay muted></video><div class="oval"></div><img id="shot" alt="Your selfie" hidden></div>'+

        '<input type="file" id="fileCap" accept="image/*" capture="user" hidden>'+
        '<button class="btn yellow huge block" id="snap" disabled>Take selfie</button>'+
        '<div class="row" id="afterSnap" hidden><button class="btn ghost" id="retake" style="flex:1">Retake</button><button class="btn green" id="submit" style="flex:2" disabled>Submit '+label.toLowerCase()+'</button></div>'+
      '</div>';
    var state={photo:null,pos:null,camOk:false};
    $('#cancel').onclick=function(){ stopCamera(); showNav(true); homeView(); };

    startCamera($('#vid')).then(function(){ state.camOk=true; refresh(); })
      .catch(function(){
        $('#vid').hidden=true; $('.oval').hidden=true;
        $('#cam').style.aspectRatio='auto'; $('#cam').style.minHeight='120px';
        $('#pmsg').innerHTML='<div class="msg note">Live camera is blocked in this browser. Tap "Take selfie" to open your phone camera.</div>';
        state.camOk='fallback'; refresh();
      });

    if(!navigator.geolocation){ gps('bad','Location not supported','Open this app in Chrome.'); }
    else {
      gpsWatch = navigator.geolocation.watchPosition(function(p){
        if(!state.pos || p.coords.accuracy < state.pos.coords.accuracy || Date.now()-state.pos.timestamp>15000) state.pos=p;
        var acc=Math.round(state.pos.coords.accuracy), dist=null;
        if(t.lat!=null && t.lng!=null) dist=haversine(state.pos.coords.latitude,state.pos.coords.longitude,t.lat,t.lng);
        var radius=t.radius||+info.settings.DEFAULT_RADIUS_M||200;
        var sub='GPS accuracy ±'+acc+' m';
        if(dist==null) gps(acc<=150?'ok':'warn','Location found',sub+'. The admin has not set your school location yet.');
        else if(dist<=radius) gps(acc<=150?'ok':'warn','You are at school · '+fmtDist(dist), sub);
        else gps('bad','You are '+fmtDist(dist)+' from school', sub+'. You can still submit, but it will be marked "Outside".');
        refresh();
      }, function(err){
        var m = err.code===1 ? 'Location permission is off' : 'Could not get location';
        gps('bad', m, err.code===1 ? 'Allow location for this site in your browser settings, then reopen the app.' : 'Turn on GPS / Location on your phone and try again.');
      }, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
    }

    function gps(kind,title,sub){ var d=$('#gdot'); if(!d) return; d.className='dot '+kind; $('#gtitle').textContent=title; $('#gsub').textContent=sub; }
    function refresh(){
      var snap=$('#snap'), sub=$('#submit'); if(!snap) return;
      snap.disabled = !state.camOk;
      sub.disabled = !(state.photo && state.pos);
      if(state.photo && !state.pos) sub.textContent='Waiting for GPS…'; else sub.textContent='Submit '+label.toLowerCase();
    }
    $('#snap').onclick=function(){
      if(state.camOk==='fallback'){ $('#fileCap').click(); return; }
      state.photo=capture($('#vid'), true, t.name); showShot();
    };
    $('#fileCap').onchange=function(e){
      var f=e.target.files&&e.target.files[0]; if(!f) return;
      var img=new Image(); img.onload=function(){ state.photo=capture(img,false,t.name); URL.revokeObjectURL(img.src); showShot(); };
      img.src=URL.createObjectURL(f);
    };
    function showShot(){
      var s=$('#shot'); s.src=state.photo; s.hidden=false; $('#vid').hidden=true; $('.oval').hidden=true;
      $('#cam').style.aspectRatio='3/4';
      $('#snap').hidden=true; $('#afterSnap').hidden=false; refresh();
    }
    $('#retake').onclick=function(){
      state.photo=null; $('#shot').hidden=true;
      if(state.camOk!=='fallback'){ $('#vid').hidden=false; $('.oval').hidden=false; } else { $('#fileCap').value=''; }
      $('#snap').hidden=false; $('#afterSnap').hidden=true; refresh();
    };
    $('#submit').onclick=function(){
      var b=$('#submit'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Saving';
      $('#retake').disabled=true;
      api('punch', {teacherId:session.teacherId, pin:session.pin, type:type, photo:state.photo,
        lat:state.pos.coords.latitude, lng:state.pos.coords.longitude, accuracy:state.pos.coords.accuracy, device:navigator.userAgent})
      .then(function(res){ stopCamera(); hist=null; resultView(res.record); })
      .catch(function(err){ b.disabled=false; $('#retake').disabled=false; refresh(); $('#pmsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'; });
    };
  }

  function resultView(r){
    var isIn=r.type==='IN';
    app.innerHTML=
      '<div class="narrow card stack result">'+
        '<p class="muted" style="margin:0">'+(isIn?'Checked in':'Checked out')+' · '+esc(niceDate(r.date))+'</p>'+
        '<div class="big num">'+esc(fmt12(r.time))+'</div>'+
        '<div class="row" style="justify-content:center">'+geoPill(r.geofence,r.distance)+
          (isIn ? (r.late?'<span class="pill warn">Late</span>':'<span class="pill ok">On time</span>') : '')+'</div>'+
        (r.note?'<div class="msg note">'+esc(r.note)+'</div>':'')+

  return {start:start};
})();

/* ------------------------------------------------- camera + photo helpers */
var camStream=null, gpsWatch=null;
function startCamera(video){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return Promise.reject(new Error('no camera api'));
  return navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:1280}},audio:false})
    .then(function(s){ camStream=s; video.srcObject=s; return video.play(); });
}
function stopCamera(){
  if(camStream){ camStream.getTracks().forEach(function(t){t.stop();}); camStream=null; }
  if(gpsWatch!=null && navigator.geolocation){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; }
}
// Crops to 3:4, shrinks to 600x800 JPEG and stamps name + phone time on the photo.
function capture(src, mirror, name){
  var sw=src.videoWidth||src.naturalWidth, sh=src.videoHeight||src.naturalHeight;
  var target=3/4, cw=sw, ch=sh;
  if(sw/sh>target){ cw=sh*target; } else { ch=sw/target; }
  var sx=(sw-cw)/2, sy=(sh-ch)/2;
  var W=600, H=800, c=document.createElement('canvas'); c.width=W; c.height=H;
  var g=c.getContext('2d');
  if(mirror){ g.translate(W,0); g.scale(-1,1); }
  g.drawImage(src,sx,sy,cw,ch,0,0,W,H);
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='rgba(18,18,18,.7)'; g.fillRect(0,H-64,W,64);
  g.fillStyle='#ffd200'; g.fillRect(0,H-64,8,64);
  g.fillStyle='#fff'; g.font='600 22px Mukta, sans-serif';
  g.fillText('BCHC · '+(name||''),20,H-36);
  g.font='18px Mukta, sans-serif';
  g.fillText(new Date().toLocaleString('en-IN'),20,H-12);
  return c.toDataURL('image/jpeg',0.72);
}

  function classDaysSoFar(ym){
    var y=+ym.slice(0,4), m=+ym.slice(5,7)-1, d=new Date(y,m,1), t=todayISO(), n=0;
    while(d.getMonth()===m && iso(d)<=t){ if(dayInfo(iso(d), data.settings, data.calMap).isClass) n++; d.setDate(d.getDate()+1); }
    return n;
  }
  function monthStats(){
    var days=groupDays(data.records);
    return data.teachers.filter(function(t){return t.active;}).map(function(t){
      var mine=days.filter(function(d){return d.teacherId===t.id && (d.inR||d.outR);});
      var total=mine.reduce(function(s,d){return s+(d.hours||0);},0), withH=mine.filter(function(d){return d.hours!=null;}).length;
      var lv=data.leaves.filter(function(l){ return l.teacherId===t.id && l.status==='APPROVED' && l.date.slice(0,7)===month && l.date<=todayISO(); }).length;
      return {t:t, leave:lv, present:mine.length, late:mine.filter(function(d){return d.inR&&d.inR.late;}).length,
        outside:mine.filter(function(d){return (d.inR&&d.inR.geofence==='OUTSIDE')||(d.outR&&d.outR.geofence==='OUTSIDE');}).length,
        fixed:mine.filter(function(d){return (d.inR&&d.inR.geofence==='REGULARIZED')||(d.outR&&d.outR.geofence==='REGULARIZED');}).length,
        noOut:mine.filter(function(d){return !d.outR;}).length, total:total, avg: withH? total/withH : null};
    });
  }
  function renderMonthly(){
    var pane=$('#pane'), stats=monthStats(), workDays=classDaysSoFar(month);

          '<td>'+durText(s.total)+'</td><td>'+(s.avg!=null?durText(s.avg):'—')+'</td></tr>'; }).join('')+

  /* ----- Excel export */
  function exportExcel(days, filename, stats, workDays){
    if(!window.XLSX){ toast('Excel tool is still loading. Try again in a moment.'); return; }
    var daily=days.map(function(d){ return {
      'Date':d.date,'Teacher ID':d.teacherId,'Teacher':d.name,
      'Check-in time':d.inR?d.inR.time:'','Late':d.inR?(d.inR.late?'Yes':'No'):'',
      'Check-in location':d.inR?d.inR.geofence:'','Check-in distance (m)':d.inR?d.inR.distance:'',
      'Check-in GPS':d.inR&&d.inR.lat!=null?d.inR.lat+','+d.inR.lng:'',
      'Check-out time':d.outR?d.outR.time:'','Check-out location':d.outR?d.outR.geofence:'','Check-out distance (m)':d.outR?d.outR.distance:'',
      'Check-out GPS':d.outR&&d.outR.lat!=null?d.outR.lat+','+d.outR.lng:'',
      'Hours worked':d.hours!=null?+(d.hours/60).toFixed(2):'',
      'Notes':[d.inR&&d.inR.note,d.outR&&d.outR.note].filter(Boolean).join('; ')
    }; });
    var raw=data.records.map(function(r){ return {'Record ID':r.id,'Date':r.date,'Time':r.time,'Teacher ID':r.teacherId,'Teacher':r.name,'Type':r.type,
      'Latitude':r.lat,'Longitude':r.lng,'GPS accuracy (m)':r.accuracy,'Distance from school (m)':r.distance,'Location':r.geofence,'Late':r.late?'Yes':'No','Selfie file ID':r.photoId,'Note':r.note}; });
    var wb=XLSX.utils.book_new();
    if(stats){
      addSheet(wb, stats.map(function(s){ return {'Teacher ID':s.t.id,'Teacher':s.t.name,'School':s.t.school,'Class days':workDays,'Days present':s.present,
        'Approved leave days':s.leave,'Attendance %':(workDays-s.leave)>0?Math.min(100,Math.round(s.present/(workDays-s.leave)*100)):100,'Late days':s.late,'Outside-school days':s.outside,'Fixed by request':s.fixed,'Missing check-outs':s.noOut,
        'Total hours':+(s.total/60).toFixed(2),'Average hours / day':s.avg!=null?+(s.avg/60).toFixed(2):''}; }), 'Monthly summary');
    }
    addSheet(wb, daily, 'Daily attendance');
    addSheet(wb, raw, 'All check-ins');
    XLSX.writeFile(wb, filename+'.xlsx');
    toast('Excel file downloaded');
  }
  function addSheet(wb, rows, name){
    var ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Info':'No data for this period'}]);
    var keys=Object.keys(rows[0]||{'Info':1});
    ws['!cols']=keys.map(function(k){ var w=k.length; rows.forEach(function(r){ w=Math.max(w,String(r[k]==null?'':r[k]).length); }); return {wch:Math.min(w+2,45)}; });
    XLSX.utils.book_append_sheet(wb, ws, name);
  }

      '<section class="stack"><h2 style="font-size:1.4rem">Posted</h2><div id="nl" class="stack"></div></section></div>';
    var list=data.announcements;
    $('#nl').innerHTML=list.length?list.map(function(a){
      var read=a.readBy.length, notRead=act.filter(function(t){ return a.readBy.indexOf(t.id)<0; }).map(function(t){return t.name;});
      return '<article class="card ann"><div class="meta">'+(a.pinned?'📌 Pinned · ':'')+esc(niceDate(String(a.createdAt).slice(0,10)))+(a.emailed?' · '+esc(a.emailed):'')+'</div>'+
        (a.title?'<h3>'+esc(a.title)+'</h3>':'')+'<div class="note">'+linkify(a.body)+'</div>'+
        '<div class="faint">Read by '+read+' of '+act.length+(notRead.length?' · Not yet: '+esc(notRead.join(', ')):'')+'</div>'+
        '<div class="row"><a class="btn small green" href="'+waLink(a)+'" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn small danger" data-del="'+esc(a.id)+'">Delete</button></div></article>'; }).join('')
      :'<div class="card empty">No announcements yet.</div>';
    $('#nf').addEventListener('submit',function(e){
      e.preventDefault(); var b=$('#nSend'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Posting';
      var payload={title:$('#nT').value,body:$('#nB').value,pinned:$('#nP').checked,email:$('#nE').checked};
      aapi('postAnnouncement',payload).then(function(r){
        var msg='Posted'+(r.emailsSent?' and emailed to '+r.emailsSent+' teacher'+(r.emailsSent>1?'s':''):'')+'.';
        if(r.emailError) msg+=' Email could not be sent: '+r.emailError;
        toast(msg); load();
      }).catch(function(err){ b.disabled=false; b.textContent='Post announcement'; $('#nMsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'; });
    });
    pane.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){
      if(b.getAttribute('data-sure')!=='1'){ b.setAttribute('data-sure','1'); b.textContent='Tap again to delete'; return; }
      b.disabled=true; aapi('deleteAnnouncement',{id:b.getAttribute('data-del')}).then(function(){ toast('Announcement deleted'); load(); }).catch(function(err){ b.disabled=false; toast(err.message); }); }; });
  }

  /* ----- Leave */
  function renderLeave(){
    var pane=$('#pane'), ym=todayISO().slice(0,7), pend=data.leaves.filter(function(l){return l.status==='PENDING';}), done=data.leaves.filter(function(l){return l.status!=='PENDING';});
    function card(l){
      var bal=leaveBalance(data.leaves.filter(function(x){return x.teacherId===l.teacherId && x.id!==l.id;}), data.settings, l.date.slice(0,7));
      return '<div class="card reqcard '+esc(l.status)+'"><div class="row between"><div class="who"><b>'+esc(l.name)+'</b><small>'+esc(l.teacherId)+'</small></div>'+statusPill(l.status)+'</div>'+
        '<div><b>'+(l.type==='SICK'?'Sick leave':'Casual leave')+'</b> on <b>'+esc(niceDate(l.date))+'</b></div><div class="muted">"'+esc(l.reason)+'"</div>'+
        (l.status==='PENDING'?'<div class="faint">'+(l.type==='SICK'?'Sick':'Casual')+' leave left that month (besides this one): '+bal[l.type].left+'</div>':'')+
        (l.adminNote?'<div class="faint">Your note: '+esc(l.adminNote)+'</div>':'')+
        (l.status==='PENDING'?'<input class="in" data-ln="'+esc(l.id)+'" placeholder="Note to teacher (optional)" maxlength="200"><div class="row"><button class="btn green small" data-lok="'+esc(l.id)+'">Approve</button><button class="btn danger small" data-lno="'+esc(l.id)+'">Reject</button></div>':'')+'</div>';
    }
    var table='<div class="tablebox"><table class="num"><thead><tr><th>Teacher</th><th>Sick used</th><th>Sick left</th><th>Casual used</th><th>Casual left</th></tr></thead><tbody>'+
      activeTeachers().map(function(t){ var b=leaveBalance(data.leaves.filter(function(l){return l.teacherId===t.id;}), data.settings, ym);
        return '<tr><td><div class="namecell">'+avatarHtml(t,30,'sm')+'<b>'+esc(t.name)+'</b></div></td><td>'+b.SICK.used+'</td><td>'+b.SICK.left+'</td><td>'+b.CASUAL.used+'</td><td>'+b.CASUAL.left+'</td></tr>'; }).join('')+'</tbody></table></div>';
    pane.innerHTML='<div class="split"><section class="stack"><h2 style="font-size:1.4rem">Waiting for you ('+pend.length+')</h2>'+(pend.length?pend.map(card).join(''):'<div class="card empty">No leave requests waiting.</div>')+
      '<h2 style="font-size:1.4rem;margin-top:8px">Decided</h2>'+(done.length?done.slice(0,30).map(card).join(''):'<div class="card empty">Nothing yet.</div>')+'</section>'+
      '<section class="stack"><h2 style="font-size:1.4rem">Leave balance · '+esc(monthTitle(ym))+'</h2>'+table+'<p class="faint" style="margin:0">Each teacher gets '+esc(data.settings.SICK_PER_MONTH)+' sick and '+esc(data.settings.CASUAL_PER_MONTH)+' casual leave per month. Change this in Settings.</p></section></div>';
    pane.querySelectorAll('[data-lok],[data-lno]').forEach(function(b){ b.onclick=function(){
      var id=b.getAttribute('data-lok')||b.getAttribute('data-lno'), ok=!!b.getAttribute('data-lok');
      b.disabled=true; aapi('decideLeave',{leaveId:id,decision:ok?'APPROVED':'REJECTED',adminNote:pane.querySelector('[data-ln="'+id+'"]').value})
        .then(function(){ toast(ok?'Leave approved':'Leave rejected'); load(); }).catch(function(err){ b.disabled=false; toast(err.message); }); }; });
  }

  /* ----- Tasks */
  function renderTasks(){
    var pane=$('#pane'), act=activeTeachers();
    pane.innerHTML='<div class="split"><form class="card stack" id="kf" novalidate><h3 style="font-size:1.6rem">New task</h3>'+
        '<label class="f">Task<input class="in" id="kT" maxlength="160" placeholder="e.g. Submit monthly student report"></label>'+
        '<label class="f">Details (optional)<textarea class="in" id="kD" maxlength="1000"></textarea></label>'+
        '<label class="f">Due date (optional)<input class="in" type="date" id="kDue"></label>'+
        '<div><div class="faint" style="margin-bottom:6px">Assign to</div><div class="chk"><label><input type="checkbox" id="kAll" checked> All teachers</label>'+
        act.map(function(t){ return '<label><input type="checkbox" name="kt" value="'+esc(t.id)+'">'+esc(t.name)+'</label>'; }).join('')+'</div></div>'+
        '<div id="kMsg" aria-live="polite"></div><button class="btn yellow" id="kSend">Assign task</button></form>'+
      '<section class="stack"><h2 style="font-size:1.4rem">Tasks</h2>'+(data.tasks.length?data.tasks.map(function(k){
        var who=k.assignedTo==='ALL'?act:act.filter(function(t){return k.assignedTo.indexOf(t.id)>=0;});
        var done=who.filter(function(t){return k.doneBy.indexOf(t.id)>=0;}), left=who.filter(function(t){return k.doneBy.indexOf(t.id)<0;});
        return '<div class="card stack" style="gap:8px"><div class="row between"><b>'+esc(k.title)+'</b>'+(k.due?'<span class="pill '+(k.due<todayISO()&&left.length?'bad':'info')+'">Due '+esc(niceDate(k.due))+'</span>':'')+'</div>'+
          (k.details?'<div class="muted note">'+linkify(k.details)+'</div>':'')+
          '<div class="progress"><i style="width:'+(who.length?Math.round(done.length/who.length*100):0)+'%"></i></div>'+
          '<div class="faint">Done by '+done.length+' of '+who.length+(left.length?' · Waiting: '+esc(left.map(function(t){return t.name;}).join(', ')):'')+'</div>'+
          '<div><button class="btn small danger" data-kdel="'+esc(k.id)+'">Delete</button></div></div>'; }).join(''):'<div class="card empty">No tasks yet.</div>')+'</section></div>';
    $('#kAll').onchange=function(){ if(this.checked) pane.querySelectorAll('input[name=kt]').forEach(function(c){ c.checked=false; }); };
    pane.querySelectorAll('input[name=kt]').forEach(function(c){ c.onchange=function(){ if(c.checked) $('#kAll').checked=false; }; });
    $('#kf').addEventListener('submit',function(e){
      e.preventDefault(); var b=$('#kSend'); b.disabled=true;
      var picked=[].slice.call(pane.querySelectorAll('input[name=kt]:checked')).map(function(c){return c.value;});
      aapi('postTask',{title:$('#kT').value,details:$('#kD').value,due:$('#kDue').value,assignedTo:$('#kAll').checked||!picked.length?'ALL':picked})
        .then(function(){ toast('Task assigned'); load(); }).catch(function(err){ b.disabled=false; $('#kMsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'; });
    });
    pane.querySelectorAll('[data-kdel]').forEach(function(b){ b.onclick=function(){
      if(b.getAttribute('data-sure')!=='1'){ b.setAttribute('data-sure','1'); b.textContent='Tap again to delete'; return; }
      b.disabled=true; aapi('deleteTask',{id:b.getAttribute('data-kdel')}).then(function(){ toast('Task deleted'); load(); }).catch(function(err){ b.disabled=false; toast(err.message); }); }; });
  }

  /* ----- Resources */
  function renderResources(){
    var pane=$('#pane');
    pane.innerHTML='<div class="split"><form class="card stack" id="rf2" novalidate><h3 style="font-size:1.6rem">Share a resource</h3>'+
        '<label class="f">Name<input class="in" id="xT" maxlength="160" placeholder="e.g. Class 3 maths worksheets"></label>'+
        '<label class="f">Link<input class="in" id="xL" inputmode="url" placeholder="https://drive.google.com/…"></label>'+
        '<label class="f">Category<input class="in" id="xC" maxlength="60" placeholder="e.g. Worksheets, Training, Forms" list="xcats"></label>'+
        '<datalist id="xcats">'+Object.keys(data.resources.reduce(function(m,r){m[r.category]=1;return m;},{})).map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist>'+
        '<label class="f">Note (optional)<input class="in" id="xN" maxlength="300"></label>'+
        '<p class="faint" style="margin:0">Tip: upload files to Google Drive, set sharing to "Anyone with the link", and paste the link here.</p>'+
        '<div id="xMsg" aria-live="polite"></div><button class="btn yellow" id="xSend">Add resource</button></form>'+
      '<section class="stack"><h2 style="font-size:1.4rem">Shared with teachers</h2>'+(data.resources.length?data.resources.map(function(r){
        return '<div class="card res"><div style="min-width:0"><div class="eyebrow">'+esc(r.category)+'</div><b>'+esc(r.title)+'</b>'+(r.note?'<div class="faint">'+esc(r.note)+'</div>':'')+'</div>'+
          '<div class="row"><a class="btn small ghost" href="'+esc(r.link)+'" target="_blank" rel="noopener">Open</a><button class="btn small danger" data-xdel="'+esc(r.id)+'">Delete</button></div></div>'; }).join(''):'<div class="card empty">Nothing shared yet.</div>')+'</section></div>';
    $('#rf2').addEventListener('submit',function(e){
      e.preventDefault(); var b=$('#xSend'); b.disabled=true;
      aapi('addResource',{title:$('#xT').value,link:$('#xL').value,category:$('#xC').value,note:$('#xN').value})
        .then(function(){ toast('Resource added'); load(); }).catch(function(err){ b.disabled=false; $('#xMsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'; });
    });
    pane.querySelectorAll('[data-xdel]').forEach(function(b){ b.onclick=function(){
      if(b.getAttribute('data-sure')!=='1'){ b.setAttribute('data-sure','1'); b.textContent='Tap again to delete'; return; }
      b.disabled=true; aapi('deleteResource',{id:b.getAttribute('data-xdel')}).then(function(){ toast('Resource deleted'); load(); }).catch(function(err){ b.disabled=false; toast(err.message); }); }; });
  }

  /* ----- Settings */
  function renderSettings(){
    var s=data.settings, pane=$('#pane'), cd=String(s.CLASS_DAYS||'').split(',');
    pane.innerHTML='<form class="stack" id="sf" style="max-width:720px" novalidate>'+
      '<section class="card stack"><h3>Weekly meeting</h3><div class="grid2">'+
        '<label class="f">Meeting name<input class="in" id="sMT" value="'+esc(s.MEETING_TITLE)+'"></label>'+
        '<label class="f">Day<select class="in" id="sMD">'+DOW_LONG.map(function(d,i){return '<option value="'+i+'"'+(String(i)===String(s.MEETING_DAY)?' selected':'')+'>'+d+'</option>';}).join('')+'</select></label>'+
        '<label class="f">Starts<input class="in" type="time" id="sMS" value="'+esc(s.MEETING_START)+'"></label>'+
        '<label class="f">Ends<input class="in" type="time" id="sME" value="'+esc(s.MEETING_END)+'"></label>'+
      '</div><label class="f">Meeting link (Google Meet or Zoom)<input class="in" id="sML" inputmode="url" value="'+esc(s.MEETING_LINK)+'" placeholder="https://meet.google.com/abc-defg-hij"></label></section>'+
      '<section class="card stack"><h3>Class days and timing</h3><div><div class="faint" style="margin-bottom:6px">Normal class days every week</div><div class="chk">'+
        DOW_LONG.map(function(d,i){ return '<label><input type="checkbox" name="cd" value="'+i+'"'+(cd.indexOf(String(i))>=0?' checked':'')+'>'+d.slice(0,3)+'</label>'; }).join('')+'</div></div>'+
        '<div><div class="faint" style="margin-bottom:6px">Holiday every week</div><div class="chk">'+
        DOW_LONG.map(function(d,i){ return '<label><input type="checkbox" name="wh" value="'+i+'"'+(dayList(s.WEEKLY_HOLIDAYS==null?'0':s.WEEKLY_HOLIDAYS).indexOf(i)>=0?' checked':'')+'>'+d.slice(0,3)+'</label>'; }).join('')+'</div>'+
        '<p class="faint" style="margin:6px 0 0">To mark a single holiday (like a festival), use the Calendar tab.</p></div>'+
        '<div class="grid2"><label class="f">Class start time<input class="in" type="time" id="sStart" value="'+esc(s.SCHOOL_START)+'"></label>'+
        '<label class="f">Late after (minutes of grace)<input class="in num" id="sGrace" inputmode="numeric" value="'+esc(s.LATE_GRACE_MIN)+'"></label>'+
        '<label class="f">Teachers can ask to fix up to (days back)<input class="in num" id="sBack" inputmode="numeric" value="'+esc(s.FIX_DAYS_BACK)+'"></label></div></section>'+
      '<section class="card stack"><h3>Leave rules</h3><div class="grid2">'+
        '<label class="f">Sick leaves per month<input class="in num" id="sSick" inputmode="numeric" value="'+esc(s.SICK_PER_MONTH)+'"></label>'+
        '<label class="f">Casual leaves per month<input class="in num" id="sCas" inputmode="numeric" value="'+esc(s.CASUAL_PER_MONTH)+'"></label></div>'+
        '<label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="sLeaveMeet"'+(String(s.LEAVE_ON_MEETING_DAY).toUpperCase()==='YES'?' checked':'')+'> Allow leave on weekly meeting days</label>'+
        '<label class="f">App link (used in emails and WhatsApp)<input class="in" id="sUrl" inputmode="url" value="'+esc(s.APP_URL)+'"></label></section>'+
      '<section class="card stack"><h3>Location and security</h3><div class="grid2">'+
        '<label class="f">Organisation name<input class="in" id="sOrg" value="'+esc(s.ORG_NAME)+'"></label>'+
        '<label class="f">Default geofence radius (m)<input class="in num" id="sRad" inputmode="numeric" value="'+esc(s.DEFAULT_RADIUS_M)+'"></label>'+
        '<label class="f">Flag GPS weaker than (m)<input class="in num" id="sAcc" inputmode="numeric" value="'+esc(s.MAX_ACCURACY_M)+'"></label>'+
        '<label class="f">New admin PIN (optional)<input class="in num" id="sPin" inputmode="numeric" type="password" placeholder="Leave empty to keep"></label>'+
      '</div></section><div id="sMsg" aria-live="polite"></div><div><button class="btn yellow" id="sSave">Save settings</button></div></form>';
    $('#sf').addEventListener('submit',function(e){
      e.preventDefault();
      var days=[].slice.call(pane.querySelectorAll('input[name=cd]:checked')).map(function(x){return x.value;}).join(',');
      var wh=[].slice.call(pane.querySelectorAll('input[name=wh]:checked')).map(function(x){return x.value;}).join(',');
      var upd={MEETING_TITLE:$('#sMT').value.trim(),MEETING_DAY:$('#sMD').value,MEETING_START:$('#sMS').value,MEETING_END:$('#sME').value,MEETING_LINK:$('#sML').value.trim(),
        CLASS_DAYS:days,WEEKLY_HOLIDAYS:wh,SCHOOL_START:$('#sStart').value,LATE_GRACE_MIN:$('#sGrace').value.trim(),FIX_DAYS_BACK:$('#sBack').value.trim(),
        SICK_PER_MONTH:$('#sSick').value.trim(),CASUAL_PER_MONTH:$('#sCas').value.trim(),LEAVE_ON_MEETING_DAY:$('#sLeaveMeet').checked?'YES':'NO',APP_URL:$('#sUrl').value.trim(),
        ORG_NAME:$('#sOrg').value.trim(),DEFAULT_RADIUS_M:$('#sRad').value.trim(),MAX_ACCURACY_M:$('#sAcc').value.trim()};
      var np=$('#sPin').value.trim(); if(np) upd.ADMIN_PIN=np;
      var b=$('#sSave'); b.disabled=true;
      api('saveSettings',{pin:pin,settings:upd}).then(function(){ if(np){ pin=np; try{sessionStorage.setItem('bchc_admin',np);}catch(e){} } toast('Settings saved'); load(); })
        .catch(function(err){ b.disabled=false; $('#sMsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'; });
    });
  }

  return {start:start};
})();

route();
})();
</script>
</body>
</html>
